name: Check styling

on: [push, pull_request]

jobs:
  pint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only checks: a workflow that commits fixes would add commits to the released line.
      - name: Check styling
        uses: aglipanci/laravel-pint-action@v2
        with:
          testMode: true
          pintVersion: 1.32.1
