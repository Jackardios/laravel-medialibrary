name: run-tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo, imagick

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg, ghostscript and the image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ghostscript jpegoptim optipng pngquant gifsicle webp

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.EXTENSIONS }}
          coverage: none

      - name: Allow ImageMagick to read PDFs
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml

      - name: Install dependencies
        # Composer skips versions with security advisories, which would silently raise the lowest
        # versions tested; --no-blocking keeps prefer-lowest at the real minimum.
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} ${{ matrix.stability == 'prefer-lowest' && '--no-blocking' || '' }} --prefer-dist --no-interaction

      - name: Show the installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|pestphp/pest|phpunit/phpunit|spatie/image|spatie/image-optimizer|guzzlehttp/psr7|symfony/console) '

      - name: Execute tests
        run: vendor/bin/pest --parallel --order-by=random

  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: S3 (MinIO)

    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: mlib-tests
      AWS_ENDPOINT: http://127.0.0.1:9000
      AWS_URL: http://127.0.0.1:9000/mlib-tests
      AWS_USE_PATH_STYLE_ENDPOINT: 1

    steps:
      - uses: actions/checkout@v7

      # MinIO no longer publishes images; this one creates the bucket with a download policy itself.
      # The bucket is ready once a missing file in it is not found rather than forbidden.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_DEFAULT_BUCKETS=mlib-tests:download bitnamilegacy/minio:2025.7.23-debian-12-r5
          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/mlib-tests/missing)" = 404 ] && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute the S3 tests
        run: vendor/bin/pest tests/Feature/S3Integration tests/Feature/Media/GetAvailableTemporaryUrlTest.php

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    name: Coverage

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg, ghostscript and the image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ghostscript jpegoptim optipng pngquant gifsicle webp

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.EXTENSIONS }}
          coverage: pcov

      - name: Allow ImageMagick to read PDFs
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Coverage
        run: vendor/bin/pest --parallel --coverage --min=88

  mutation:
    runs-on: ubuntu-latest
    # About 16 minutes on 10 local processes; GitHub's runners have 4.
    timeout-minutes: 60

    name: Mutation testing

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg, ghostscript and the image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ghostscript jpegoptim optipng pngquant gifsicle webp

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.EXTENSIONS }}
          coverage: pcov

      - name: Allow ImageMagick to read PDFs
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The mutation plugin counts a mutation as caught when its test run fails for any reason:
      # when the --filter of a line covered by some 400 tests is too large for PCRE ("No tests
      # found"), or when a run times out. Its score can only come out higher than the real one
      # (76.99 % measured on 2.0 with those runs fixed), so the minimum guards against drops.
      # Don't pass --processes: it is forwarded to every mutation run, which then fails.
      - name: Mutation testing
        run: vendor/bin/pest --mutate --everything --covered-only --parallel --min=75

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    # Experimental: the package is not verified on Windows yet.
    continue-on-error: true

    name: Windows (experimental)

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --ignore-platform-req=ext-imagick

      - name: Execute tests
        run: vendor/bin/pest

  php-next:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Experimental: the next PHP version is not released yet.
    continue-on-error: true

    name: PHP 8.6 (experimental)

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg, ghostscript and the image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ghostscript jpegoptim optipng pngquant gifsicle webp

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Allow ImageMagick to read PDFs
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --ignore-platform-req=php+ --ignore-platform-req=ext-imagick

      - name: Execute tests, logging deprecations
        env:
          LOG_DEPRECATIONS_WHILE_TESTING: true
          MEDIA_LIBRARY_DEPRECATIONS_LOG: ${{ runner.temp }}/deprecations.log
        run: vendor/bin/pest

      # Deprecations of the dependencies are shown; only the package's own fail the job.
      - name: Fail on deprecations
        run: |
          LOG="${{ runner.temp }}/deprecations.log"
          [ -s "$LOG" ] || exit 0
          sed 's/^\[[^]]*\] //' "$LOG" | sort | uniq -c | sort -rn | head -100
          if grep -qE " in ${GITHUB_WORKSPACE}/(src|tests)/" "$LOG"; then exit 1; fi

  laravel-next:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Experimental: tracks the next Laravel version.
    continue-on-error: true

    name: Laravel dev-master (experimental)

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg, ghostscript and the image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ghostscript jpegoptim optipng pngquant gifsicle webp

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.EXTENSIONS }}
          coverage: none

      - name: Allow ImageMagick to read PDFs
        run: sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-*/policy.xml

      # orchestra/testbench has no branch for the next Laravel version, testbench-core has.
      - name: Install dependencies
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer remove --dev orchestra/testbench --no-interaction --no-update
          composer require --dev "laravel/framework:dev-master" "orchestra/testbench-core:12.x-dev" --no-interaction --no-update
          composer update --prefer-dist --no-interaction -W

      - name: Execute tests
        run: vendor/bin/pest
